
program: main.py
project: ICLR-2026-rebuttal
name: fkd-ns-ds2-noise2
method: bayes
metric:
  goal: minimize
  name: score
parameters:
  algorithm.method.temperature_inv:
    distribution: log_uniform_values
    min: 0.01
    max: 1000
  algorithm.method.threshold:
    values: [0.1, 0.2, 0.3]
  algorithm.method.potential_type:
    values: ['diff', 'add', 'max']
  algorithm.method.diffusion_scheduler_config.num_steps:
    values: [100, 200, 400, 800]

early_terminate:
  type: hyperband
  max_iter: 300
  eta: 3
  s: 3

command:
  - ${env}
  - python
  - ${program}
  - problem=navier-stokes                          # Set the problem config
  - problem.model.adaptive=True                    # Set the solver's adaptive time stepping to False to avoid too small time steps
  - problem.data.root="../data/navier-stokes-val/Re200.0-t5.0"   # Path to the validation dataset
  - problem.model.sigma_noise=2.0
  - algorithm=fkd                                 # Set the algorithm config
  - algorithm.method.num_particles=1024
  - pretrain=navier-stokes                          # Set the pre-trained model config
  - compile=True
  - wandb=True
  - problem.data.id_list="0-0"                    # String that indicates the indices of data to use. "0-2" includes 0, 1, and 2. "0,3-4" includes 0, 3, and 4.
  - ${args_no_hyphens}

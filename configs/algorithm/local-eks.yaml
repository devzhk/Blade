name: Localized-EKS-DM
method:
  _target_: algo.local-eks-dm.LocalizedEKS_DM
  guidance_scale: 10.0
  num_steps: 300
  batch_size: 256
  gamma: 0.1
  ensemble_size: 1024
  localization_scale: 10.0
  clean_init: True
  mode: correction
  diffusion_scheduler_config:
    num_steps: 100
    sigma_min: 0.002
    sigma_max: 80.0
    schedule: 'linear'
    timestep: 'poly-7'